name: Beta

on:
  workflow_dispatch:
    inputs:
      highlights:
        description: Optional summary shown at the top of the release notes (markdown)
        type: string
        required: false

concurrency:
  group: releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.base }}
      number: ${{ steps.v.outputs.number }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Require develop
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Run this workflow on the develop branch (selected: $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          base=$(sed -n 's/^MARKETING_VERSION = //p' Build.xcconfig)
          number=$(python3 .github/scripts/release.py next-beta --base "$base")
          {
            echo "base=${base}"
            echo "number=${number}"
            echo "version=${base}-beta.${number}"
            echo "tag=v${base}-beta.${number}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      marketing_version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      BASE: ${{ needs.version.outputs.base }}
      NUMBER: ${{ needs.version.outputs.number }}
      HIGHLIGHTS: ${{ inputs.highlights }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Write release notes
        run: |
          printf '%s' "$HIGHLIGHTS" > highlights.md
          python3 .github/scripts/release.py notes --kind beta --version "$VERSION" --tag "$TAG" --sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --ipa SideStore.ipa --highlights highlights.md > notes.md

      - name: Create release
        run: |
          gh release create "$TAG" SideStore.ipa SideStore.dSYMs.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NextStore ${BASE} Beta ${NUMBER}" \
            --notes-file notes.md
