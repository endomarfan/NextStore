name: Build

on:
  workflow_call:
    inputs:
      marketing_version:
        type: string
        required: true
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build SideStore
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-${{ hashFiles('**/Package.resolved') }}-

      - name: Build
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -o pipefail && MARKETING_VERSION="$MARKETING_VERSION" make build 2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}

      - name: Package
        run: |
          make fakesign ipa
          zip -r -9 ./SideStore.dSYMs.zip ./SideStore.xcarchive/dSYMs

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            SideStore.ipa
            SideStore.dSYMs.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
