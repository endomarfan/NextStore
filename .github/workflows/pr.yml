name: Pull Request

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(sed -n 's/^MARKETING_VERSION = //p' Build.xcconfig)
          echo "version=${base}-pr.${PR_NUMBER}+${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

  unit-tests:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/NextStoreKit

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      marketing_version: ${{ needs.version.outputs.version }}
